[window]
padding = { x = 8, y = 8 }
dynamic_padding = true
# Decorations "Full", "None", "Transparent"(macOS), "Buttonless"(macOS)
decorations = "Full"
opacity = 0.85
# For macOS/KDE wayland ( true | false )
blur = true
# Startup_mode "Windowed", "Maximized" | "Fullscreen" | "SimpleFullscreen"(macOS)
startup_mode = "Windowed"
title = "DA~LALA~"
dynamic_title = true

[scrolling]
history = 20000
multiplier = 3

[font]
size = 12.0
builtin_box_drawing = true

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
style = "Bold"

[font.italic]
style = "Italic"

[font.bold_italic]
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 750
unfocused_hollow = true

[terminal]
# shell = { program = "/usr/bin/zsh", args = "-l"}
# osc52 "Disable", "OnlyCopy", "OnlyPaste", "CopyPaste"
# osc52 = "OnlyCopy""

[selection]
# save_to_clipboard = false
# semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[mouse]
hide_when_typing = true

[keyboard]
bindings = [
  { key = "Return", mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "N", mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "T", mods = "Control|Shift", action = "CreateNewTab" },
  { key = "]", mods = "Control|Shift", action = "SelectNextTab" },
  { key = "[", mods = "Control|Shift", action = "SelectPreviousTab" },
  { key = "1", mods = "Control|Shift", action = "SelectTab1" },
  { key = "2", mods = "Control|Shift", action = "SelectTab2" },
  { key = "3", mods = "Control|Shift", action = "SelectTab3" },
  { key = "4", mods = "Control|Shift", action = "SelectTab4" },
  { key = "5", mods = "Control|Shift", action = "SelectTab5" },
  { key = "6", mods = "Control|Shift", action = "SelectTab6" },
  { key = "7", mods = "Control|Shift", action = "SelectTab7" },
  { key = "8", mods = "Control|Shift", action = "SelectTab8" },
  { key = "9", mods = "Control|Shift", action = "SelectTab9" },
  { key = "0", mods = "Control|Shift", action = "SelectLastTab" },
]

[general]
ipc_socket = true
live_config_reload = true
import = [
# "./themes/current.toml",
  "~/.config/alacritty/current.toml",
]

[env]
TERM = "alacritty"
# 遠端沒 terminfo 再改成 xterm-256color
# TERM = "xterm-256color"
EDITOR = "nvim"
